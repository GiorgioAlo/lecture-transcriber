[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-transcriber"
version = "1.1.0"
description = "Turn lecture audio/video or links (YouTube/Webex) into cleaned, translated Word documents using Google Gemini."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GiorgioAlo" }]
keywords = ["transcription", "lectures", "gemini", "whisper", "yt-dlp"]

# Runtime dependencies of the CLI/engine. ffmpeg is NOT a Python package: it must
# be installed separately (brew/apt/choco) and be on PATH. The GUI (pywebview) is
# intentionally NOT required here — the CLI does not need it.
dependencies = [
    "google-genai>=2.25",
    "python-docx>=1.1",
    "yt-dlp>=2025.1.1",
]

[project.urls]
Homepage = "https://github.com/GiorgioAlo/lecture-transcriber"
Issues = "https://github.com/GiorgioAlo/lecture-transcriber/issues"

[project.scripts]
transcribe = "trascrittore.cli:main"

[tool.setuptools]
# Ship only the engine package; app.py and ui/ belong to the desktop app.
packages = ["trascrittore"]
